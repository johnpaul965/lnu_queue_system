name: lnu_queue_system
description: LNU Registrar Queue and Request Management System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Image picker — student uploads requirement images/PDFs
  image_picker: ^1.1.2

  # UI — date/time formatting
  intl: ^0.19.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # URL Launcher — open requirement file links
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#0D0D7A"
  image: assets/lnu_logo.png
  android: true
  ios: false
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lnu_logo.png
    - .env
